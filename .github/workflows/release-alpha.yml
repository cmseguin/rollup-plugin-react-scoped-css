name: Release Alpha Workflow

on:
  push:
    branches:
      - 'releases/**-alpha'
    # paths-ignore:
    #   - '.github/**'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Extract version from branch name
        id: extract_version
        run: echo "version=$(echo ${{ github.ref }} | sed -n 's/refs\/heads\/releases\/\(.*\)-alpha/\1/p')" >> "$GITHUB_OUTPUT"
      - name: Extract rc from package.json
        id: next_extract_rc
        run: echo "rc=$(npm show rollup-plugin-react-scoped-css versions --json | grep -E '${{ steps.extract_version.outputs.version }}-alpha' | sed 's/"//g; s/,//g' | sort -V | tail -n 1 | tail | awk -F '-alpha\\.' '{if (NF > 1) {print $2 + 1} else {print 0}}')" >> "$GITHUB_OUTPUT"
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - name: Bump version and publish to npm
        run: |
          # Use the extracted version number for your release process
          echo "Version: ${{ steps.extract_version.outputs.version }}-alpha.${{ steps.next_extract_rc.outputs.rc }}"
          npm version ${{ steps.extract_version.outputs.version }}-alpha.${{ steps.next_extract_rc.outputs.rc }} --no-git-tag-version
      - name: Release
        run: npm publish --access public --tag alpha
